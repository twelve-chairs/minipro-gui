# SonarQube Cloud, CI-based analysis (.github/workflows/sonar.yaml). Automatic Analysis must stay
# off for the project: it can't import coverage, and the two can't both run.
sonar.organization=twelvechairs
sonar.projectKey=twelve-chairs_minipro-gui
sonar.projectName=minipro-gui
sonar.sourceEncoding=UTF-8

# The app's code, its build file and the workflows (for the GitHub Actions rules).
sonar.sources=src,CMakeLists.txt,.github
sonar.tests=tests
# Local and CI build output under tests/ (generated moc files, the coverage report).
sonar.test.exclusions=tests/build/**,tests/build-coverage/**

# Both written by tests/coverage.sh.
sonar.cfamily.compile-commands=tests/build-coverage/compile_commands.json
sonar.cfamily.llvm-cov.reportPath=tests/build-coverage/coverage.txt
# main() only builds the QApplication and the window; the tests use QTEST_MAIN instead.
sonar.coverage.exclusions=src/main.cpp
