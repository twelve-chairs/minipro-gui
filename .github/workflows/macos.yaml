name: Build MacOS

on:
  workflow_dispatch:
  push:
    branches:
      - 'master'
    paths:
      - src/**
      - CMakeLists.txt
      - .github/workflows/macos.yaml
      - minipro-gui.qrc
      - res/**
  pull_request:
    branches:
      - 'master'
    paths:
      - src/**
      - CMakeLists.txt
      - .github/workflows/macos.yaml
      - minipro-gui.qrc
      - res/**
  schedule:
    - cron:  '0 0 1 * *'

# Read-only token: these jobs only check out and build.
permissions:
  contents: read

env:
  BUILD_TYPE: MinSizeRel

jobs:
  MacOS:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false  # later steps don't use git
      - name: Build MacOS
        shell: bash
        run: |
          brew install ninja cmake qt
          cmake -DCMAKE_BUILD_TYPE=${BUILD_TYPE} -DCMAKE_MAKE_PROGRAM=ninja -G Ninja -S . -B "./cmake-build-${BUILD_TYPE}"
          cmake --build ./cmake-build-${BUILD_TYPE} --target minipro-gui -- -j 2
