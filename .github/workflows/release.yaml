name: Release

# Pushing a version tag (v1.2 or v1.2.3) builds the Windows, macOS and Linux packages and creates
# a draft GitHub release with them, for a maintainer to review and publish. Started by hand or
# from a pull request that changes the packaging, it only builds the packages (as run artifacts).
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
  pull_request:
    branches:
      - 'master'
    paths:
      - .github/workflows/release.yaml
      - packaging/**

# Read-only by default; only the publish job, which runs for tags alone, can write.
permissions:
  contents: read

env:
  # Same Qt as the Windows build and test workflows.
  QT_VERSION: 6.10.3

jobs:
  Version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - id: version
        shell: bash
        # From the environment, not ${{ }}, so a tag name can't inject shell code.
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            if ! [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+(\.[0-9]+){1,2}$ ]]; then
              echo "::error::Release tags look like v1.2 or v1.2.3, not $GITHUB_REF_NAME"
              exit 1
            fi
            version="$GITHUB_REF_NAME"
          else
            version="dev-${GITHUB_SHA::7}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  Windows:
    needs: Version
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.Version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false  # later steps don't use git
      - uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4.5.0
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2022_64
          aqtversion: '==3.3.0'
          cache: false  # a release is built from a fresh download, never from a cache
      - name: Build and package
        shell: pwsh
        run: |
          cmake -A x64 -S . -B build
          cmake --build build --config MinSizeRel --target minipro-gui
          New-Item -ItemType Directory -Path minipro-gui | Out-Null
          Copy-Item build/MinSizeRel/minipro-gui.exe minipro-gui/
          # Same flags as windows.yaml: no Qt Network, no software OpenGL fallback.
          windeployqt --release --no-translations --no-network --no-opengl-sw minipro-gui/minipro-gui.exe
          Copy-Item packaging/THIRD-PARTY-NOTICES.txt, LICENSE minipro-gui/
          Copy-Item -Recurse packaging/licenses minipro-gui/
          New-Item -ItemType Directory -Path out | Out-Null
          Compress-Archive -Path minipro-gui -DestinationPath "out/minipro-gui-$env:VERSION-windows-x64.zip"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-windows
          path: out/*
          if-no-files-found: error

  MacOS:
    needs: Version
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.Version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false  # later steps don't use git
      - uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4.5.0
        with:
          version: ${{ env.QT_VERSION }}
          arch: clang_64  # Qt's macOS build is universal (Apple silicon and Intel)
          aqtversion: '==3.3.0'
          cache: false  # a release is built from a fresh download, never from a cache
      - name: Build and package
        shell: bash
        run: |
          cmake -DCMAKE_BUILD_TYPE=MinSizeRel -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -S . -B build
          cmake --build build --target minipro-gui -- -j 3
          macdeployqt build/minipro-gui.app
          # Not yet signed with a Developer ID or notarized (step 2). macdeployqt changed the
          # binaries, so sign ad hoc again: Apple silicon won't run a binary with a broken signature.
          codesign --force --deep --sign - build/minipro-gui.app
          lipo -archs build/minipro-gui.app/Contents/MacOS/minipro-gui
          mkdir -p dmg out
          cp -R build/minipro-gui.app dmg/
          ln -s /Applications dmg/Applications
          cp packaging/THIRD-PARTY-NOTICES.txt LICENSE dmg/
          cp -R packaging/licenses dmg/
          hdiutil create -volname "Minipro GUI" -srcfolder dmg -ov -format UDZO "out/minipro-gui-$VERSION-macos.dmg"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-macos
          path: out/*
          if-no-files-found: error

  Linux:
    needs: Version
    # The oldest supported Ubuntu: an AppImage runs on systems with this glibc or newer.
    runs-on: ubuntu-22.04
    env:
      VERSION: ${{ needs.Version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false  # later steps don't use git
      - uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4.5.0
        with:
          version: ${{ env.QT_VERSION }}
          arch: linux_gcc_64
          aqtversion: '==3.3.0'
          cache: false  # a release is built from a fresh download, never from a cache
      - name: Build and package
        shell: bash
        run: |
          sudo apt-get install -y libgl1-mesa-dev libxcb-cursor0 libfuse2 imagemagick
          cmake -DCMAKE_BUILD_TYPE=MinSizeRel -DCMAKE_INSTALL_PREFIX=/usr -S . -B build
          cmake --build build --target minipro-gui -- -j 2
          DESTDIR="$PWD/AppDir" cmake --install build
          install -D -m 644 packaging/THIRD-PARTY-NOTICES.txt AppDir/usr/share/doc/minipro-gui/THIRD-PARTY-NOTICES.txt
          install -D -m 644 LICENSE AppDir/usr/share/doc/minipro-gui/LICENSE
          cp -R packaging/licenses AppDir/usr/share/doc/minipro-gui/
          # linuxdeploy takes icons up to 512x512; the source icon is 1024x1024.
          convert res/AppIcon.png -resize 256x256 minipro-gui.png

          # Fixed releases, checked against their SHA-256 before they run.
          mkdir tools
          curl -sSfL -o tools/linuxdeploy-x86_64.AppImage \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20251107-1/linuxdeploy-x86_64.AppImage
          curl -sSfL -o tools/linuxdeploy-plugin-qt-x86_64.AppImage \
            https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/1-alpha-20250213-1/linuxdeploy-plugin-qt-x86_64.AppImage
          sha256sum -c - <<'EOF'
          c20cd71e3a4e3b80c3483cef793cda3f4e990aca14014d23c544ca3ce1270b4d  tools/linuxdeploy-x86_64.AppImage
          15106be885c1c48a021198e7e1e9a48ce9d02a86dd0a1848f00bdbf3c1c92724  tools/linuxdeploy-plugin-qt-x86_64.AppImage
          EOF
          chmod +x tools/*.AppImage

          mkdir out
          export QMAKE="$QT_ROOT_DIR/bin/qmake"
          export APPIMAGE_EXTRACT_AND_RUN=1  # no FUSE needed to run the tools
          export LDAI_OUTPUT="out/minipro-gui-$VERSION-linux-x86_64.AppImage"
          tools/linuxdeploy-x86_64.AppImage --appdir AppDir --plugin qt --output appimage \
            --desktop-file AppDir/usr/share/applications/minipro-gui.desktop --icon-file minipro-gui.png
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-linux
          path: out/*
          if-no-files-found: error

  Publish:
    # Tags only: a manual or pull request run stops at the artifacts above.
    if: github.ref_type == 'tag'
    needs: [Version, Windows, MacOS, Linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write      # create the release
      id-token: write      # sign the build provenance
      attestations: write  # store it
    env:
      VERSION: ${{ needs.Version.outputs.version }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Checksums
        shell: bash
        run: |
          cd dist
          sha256sum minipro-gui-* > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/minipro-gui-*
      - name: Create the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'EOF'
          ## Downloads

          - **Windows:** `minipro-gui-…-windows-x64.zip`. Unzip it and run `minipro-gui.exe`. It needs the [Microsoft Visual C++ Redistributable](https://learn.microsoft.com/cpp/windows/latest-supported-vc-redist). The app isn't code-signed yet, so SmartScreen may warn about an unknown publisher: choose **More info → Run anyway**.
          - **macOS** (Apple silicon and Intel): `minipro-gui-…-macos.dmg`. Drag the app to Applications. It isn't signed with a Developer ID or notarized yet, so the first time macOS blocks it: open **System Settings → Privacy & Security** and choose **Open Anyway**.
          - **Linux** (x86-64): `minipro-gui-…-linux-x86_64.AppImage`. Make it executable (`chmod +x`) and run it.

          minipro-gui runs the [minipro](https://gitlab.com/DavidGriffith/minipro) CLI, which isn't included: install it first and make sure it's on your `PATH` (on macOS, Homebrew's folder is found too). On Windows the programmer also needs the WinUSB driver; see the README.

          ## Verifying a download

          `SHA256SUMS.txt` lists each file's SHA-256. Each file also has a build provenance attestation; check it with `gh attestation verify <file> --repo twelve-chairs/minipro-gui`.
          EOF
          gh release create "$VERSION" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --draft \
            --title "minipro-gui $VERSION" --notes-file notes.md
