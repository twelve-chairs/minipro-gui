name: Unit Tests

on:
  workflow_dispatch:
  push:
    branches:
      - 'master'
    paths:
      - src/**
      - tests/**
      - .github/workflows/tests.yaml
      - minipro-gui.qrc
      - res/**
  pull_request:
    branches:
      - 'master'
    paths:
      - src/**
      - tests/**
      - .github/workflows/tests.yaml
      - minipro-gui.qrc
      - res/**
  schedule:
    - cron:  '0 0 1 * *'

# Read-only token: these jobs only check out and build.
permissions:
  contents: read

env:
  BUILD_TYPE: Debug
  # Same Qt as the Windows build (windows.yaml).
  QT_VERSION: 6.10.3

jobs:
  Tests:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false  # later steps don't use git
      - name: Build Tests
        shell: bash
        run: |
          brew install ninja cmake qt
          cd tests
          ./run_tests.sh

  Tests-Windows:
    name: Tests (Windows)
    runs-on: windows-latest
    env:
      # MSVC Debug links Qt's debug DLLs, too slow for the timing checks. This links the release
      # Qt the app ships with and keeps asserts' line info.
      BUILD_TYPE: RelWithDebInfo
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false  # later steps don't use git
      - uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4.5.0
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2022_64
          aqtversion: '==3.3.0'
          cache: true
      - name: Build and run tests
        shell: pwsh
        run: |
          # run_tests.sh needs a POSIX shell and Ninja; Visual Studio's generator is multi-config.
          cmake -A x64 -S tests -B tests/build
          cmake --build tests/build --config $env:BUILD_TYPE
          ctest --test-dir tests/build -C $env:BUILD_TYPE --output-on-failure
      - name: Diagnose (temporary) - each test function alone, 30 s limit
        if: failure()
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QPA_FONTDIR: C:/Windows/Fonts
          QTEST_FUNCTION_TIMEOUT: '30000'
        run: |
          $exe = "tests/build/$env:BUILD_TYPE/mainwindow_test.exe"
          $runs = @('largeImageLoadsQuickly',
                    'oddDeviceInfoOutput:fields missing',
                    'oddDeviceInfoOutput:unknown lines and order',
                    'oddDeviceInfoOutput:no fields',
                    'oddDeviceInfoOutput:escape sequences',
                    'oddDeviceInfoOutput:very long line')
          foreach ($r in $runs) {
            Remove-Item -ErrorAction SilentlyContinue out.txt
            & $exe $r -o out.txt,txt 2>&1 | Out-Null
            "== $r exit=$LASTEXITCODE"
            if (Test-Path out.txt) { Get-Content out.txt | Select-String -NotMatch '^PASS' }
          }
          exit 0
