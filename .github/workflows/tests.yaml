name: Unit Tests

on:
  workflow_dispatch:
  push:
    branches:
      - 'master'
    paths:
      - src/**
      - tests/**
  pull_request:
    branches:
      - 'master'
    paths:
      - src/**
      - tests/**
  schedule:
    - cron:  '0 0 1 * *'

# Read-only token: these jobs only check out and build.
permissions:
  contents: read

env:
  BUILD_TYPE: Debug

jobs:
  Tests:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build Tests
        shell: bash
        run: |
          brew install ninja cmake qt
          cd tests
          ./run_tests.sh
