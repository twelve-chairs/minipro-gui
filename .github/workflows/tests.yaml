name: Unit Tests

on:
  workflow_dispatch:
  push:
    branches:
      - 'master'
    paths:
      - src/**
      - tests/**
      - .github/workflows/tests.yaml
      - minipro-gui.qrc
      - res/**
  pull_request:
    branches:
      - 'master'
    paths:
      - src/**
      - tests/**
      - .github/workflows/tests.yaml
      - minipro-gui.qrc
      - res/**
  schedule:
    - cron:  '0 0 1 * *'

# Read-only token: these jobs only check out and build.
permissions:
  contents: read

env:
  BUILD_TYPE: Debug
  # Same Qt as the Windows build (windows.yaml).
  QT_VERSION: 6.10.3

jobs:
  Tests:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false  # later steps don't use git
      - name: Build Tests
        shell: bash
        run: |
          brew install ninja cmake qt
          cd tests
          ./run_tests.sh

  Tests-Windows:
    name: Tests (Windows)
    runs-on: windows-latest
    env:
      # MSVC Debug links Qt's debug DLLs, too slow for the timing checks. This links the release
      # Qt the app ships with and keeps asserts' line info.
      BUILD_TYPE: RelWithDebInfo
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false  # later steps don't use git
      - uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4.5.0
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2022_64
          aqtversion: '==3.3.0'
          cache: true
      - name: Build and run tests
        shell: pwsh
        run: |
          # run_tests.sh needs a POSIX shell and Ninja; Visual Studio's generator is multi-config.
          cmake -A x64 -S tests -B tests/build
          cmake --build tests/build --config $env:BUILD_TYPE
          ctest --test-dir tests/build -C $env:BUILD_TYPE --output-on-failure
      - name: Diagnose (temporary) - stack of the very long line crash
        if: failure()
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QPA_FONTDIR: C:/Windows/Fonts
        run: |
          $exe = Resolve-Path "tests/build/$env:BUILD_TYPE/mainwindow_test.exe"
          $cdb = Get-ChildItem "C:/Program Files (x86)/Windows Kits/10/Debuggers/x64/cdb.exe" -ErrorAction SilentlyContinue
          if (-not $cdb) { "cdb not found"; exit 0 }
          $env:PATH = "$env:QT_ROOT_DIR/bin;$env:PATH"
          # -g: skip the initial break; at the exception, print the stack and quit.
          & $cdb.FullName -g -lines -y "srv*;$(Split-Path $exe)" -c ".lines -e; .ecxr; kn 60; q" $exe 'oddDeviceInfoOutput:very long line' 2>&1 |
            Select-String -NotMatch '^(ModLoad|Symbol search path|Executable search path)' | Select-Object -Last 120
          exit 0
