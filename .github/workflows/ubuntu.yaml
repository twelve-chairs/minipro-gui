name: Build Ubuntu

on:
  workflow_dispatch:
  push:
    branches:
      - 'master'
    paths:
      - src/**
      - CMakeLists.txt
      - .github/workflows/ubuntu.yaml
      - minipro-gui.qrc
      - res/**
  pull_request:
    branches:
      - 'master'
    paths:
      - src/**
      - CMakeLists.txt
      - .github/workflows/ubuntu.yaml
      - minipro-gui.qrc
      - res/**
  schedule:
    - cron:  '0 0 1 * *'

# Read-only token: these jobs only check out and build.
permissions:
  contents: read

env:
  BUILD_TYPE: MinSizeRel

jobs:
  Ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false  # later steps don't use git
      - name: Build Ubuntu
        shell: bash
        run: |
          sudo apt-get install build-essential ninja-build cmake libgl1-mesa-dev qt6-base-dev desktop-file-utils -y
          cmake -DCMAKE_BUILD_TYPE=${BUILD_TYPE} -DCMAKE_MAKE_PROGRAM=ninja -G Ninja -S . -B "./cmake-build-${BUILD_TYPE}"
          cmake --build ./cmake-build-${BUILD_TYPE} --target minipro-gui -- -j 2
      - name: Check the desktop entry and install rules
        shell: bash
        run: |
          desktop-file-validate res/minipro-gui.desktop
          cmake --install ./cmake-build-${BUILD_TYPE} --prefix "$RUNNER_TEMP/stage"
          test -x "$RUNNER_TEMP/stage/bin/minipro-gui"
          test -f "$RUNNER_TEMP/stage/share/applications/minipro-gui.desktop"
          test -f "$RUNNER_TEMP/stage/share/pixmaps/minipro-gui.png"
